<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Brandbook · Fórmula do Boi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<script src="deck-stage.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<deck-stage id="deck"></deck-stage>
<div id="app-root" style="display:none"></div>

<script type="text/babel" src="components/chrome.jsx"></script>
<script type="text/babel" src="components/slides-01-intro.jsx"></script>
<script type="text/babel" src="components/slides-02-identity.jsx"></script>
<script type="text/babel" src="components/slides-03-system.jsx"></script>
<script type="text/babel" src="components/slides-04-apps.jsx"></script>
<script type="text/babel" src="components/slides-05-closing.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <>
      <SlideCover/>
      <SlideTOC/>
      <SlideManifesto/>
      <SlidePositioning/>
      <SlidePersonality/>
      <SlideLogoOverview/>
      <SlideLogoRules/>
      <SlideLogoMisuse/>
      <SlidePalette/>
      <SlidePaletteWCAG/>
      <SlideTypeOverview/>
      <SlideTypeScale/>
      <SlideGraphicsLib/>
      <SlidePhoto/>
      <SlideLeiloes/>
      <SlideSemen/>
      <SlideEmbrioes/>
      <SlideInstitucional/>
      <SlideSocialGrid/>
      <SlideCopy/>
      <SlideClosing/>
    </>
  );
}

// Render directly into deck-stage; its slotchange observer picks sections up.
ReactDOM.createRoot(document.getElementById('deck')).render(<App/>);
const orphan = document.getElementById('app-root');
if (orphan) orphan.remove();
</script>

<script>
(async () => {
  try { await customElements.whenDefined('deck-stage'); } catch (e) {}
  try { await document.fonts.ready; } catch (e) {}
  setTimeout(() => { try { window.print(); } catch (e) {} }, 500);
})();
</script>
</body>
</html>
