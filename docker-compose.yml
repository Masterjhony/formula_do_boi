version: '3.8'

services:
  whatsapp-server:
    build:
      context: ./whatsapp-server
      dockerfile: Dockerfile
    container_name: formula_boi_whatsapp
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - WHATSAPP_SERVER_PORT=3001
    # O container vai pegar as vars do .env.local automaticamente via --env-file
    # docker compose --env-file .env.local up -d

  # ─────────────────────────────────────────────────────────────────────────
  # Segunda sessão Baileys: monitora grupos por PDFs de catálogo de leilão.
  # Container, porta, auth folder e número WhatsApp completamente separados
  # da Central — assim não há risco de uma derrubar a outra.
  # ─────────────────────────────────────────────────────────────────────────
  whatsapp-catalogs:
    build:
      context: ./whatsapp-catalogs-server
      dockerfile: Dockerfile
    container_name: formula_boi_whatsapp_catalogs
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - WHATSAPP_CATALOGS_SERVER_PORT=3002
      - NEXT_JS_URL=${NEXT_JS_URL}
      - WHATSAPP_GROUP_TASK_SECRET=${WHATSAPP_GROUP_TASK_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_BUCKET=${R2_BUCKET}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_PREFIX=${R2_PREFIX}
      - POLL_GROUPS_EVERY_MS=300000
    volumes:
      - /opt/whatsapp-catalogs-auth:/data/auth
