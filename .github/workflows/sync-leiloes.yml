name: Sincronizar agenda de leilões

# Sincroniza textos (cronograma_leiloes) e capas (bula_leiloes) a partir da
# planilha pública do Google Sheets "ESCALA LEILÕES 2026".
#
# A agenda do site é um espelho exato da planilha — o sync ADICIONA,
# ATUALIZA e REMOVE leilões em cronograma_leiloes pra bater 100%.
#
# Disparos:
#   • cron de hora em hora
#   • workflow_dispatch (manual no admin pelo botão em /web-admin/leiloes,
#     ou pela aba Actions do GitHub)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-leiloes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # pillow é obrigatório: sem ele o openpyxl descarta silenciosamente
        # as imagens embutidas na leitura, e upload_leilao_images.py acha
        # "0 imagens embutidas" mesmo a planilha tendo as capas.
        run: pip install --quiet openpyxl requests pillow

      # Texto primeiro: cria/atualiza/remove os leilões em cronograma_leiloes.
      - name: Sincronizar texto (cronograma_leiloes)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/sync_cronograma_from_sheets.py

      # Capas depois: anexa as imagens da planilha aos leilões já existentes.
      - name: Sincronizar capas (cronograma_leiloes.img)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/upload_leilao_images.py
