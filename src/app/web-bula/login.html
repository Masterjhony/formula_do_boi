<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bula Assessoria -- Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body { font-family:'Inter',-apple-system,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
.material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 20; vertical-align:middle; }

/* ── LAYOUT ── */
.login-page { display:flex; height:100vh; }

/* ── LEFT: PHOTO ── */
.login-photo { flex:1; position:relative; overflow:hidden; display:flex; align-items:flex-end; }
.login-photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(0.55) saturate(0.8); }
.login-photo-overlay { position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0.85) 100%); }
.login-photo-content { position:relative; z-index:2; padding:48px; width:100%; }
.login-photo-tagline { font-size:32px; font-weight:800; color:#fff; letter-spacing:-0.5px; line-height:1.2; margin-bottom:12px; }
.login-photo-tagline span { color:#C8A96E; }
.login-photo-sub { font-size:14px; color:rgba(255,255,255,0.6); font-weight:300; line-height:1.6; max-width:420px; }
.login-photo-badge { position:absolute; top:36px; left:48px; z-index:2; display:flex; align-items:center; gap:8px; }
.login-photo-badge-dot { width:8px; height:8px; border-radius:50%; background:#C8A96E; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.3)} }
.login-photo-badge-text { font-size:11px; color:rgba(255,255,255,0.5); letter-spacing:1px; text-transform:uppercase; font-weight:500; }

/* ── RIGHT: FORM ── */
.login-form-side { width:480px; flex-shrink:0; background:#0D0D0D; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px; position:relative; overflow-y:auto; }

.login-logo { height:80px; filter:invert(1); margin-bottom:36px; }

.login-welcome { text-align:center; margin-bottom:36px; }
.login-welcome h1 { font-size:22px; font-weight:700; color:#F5F5F5; margin-bottom:6px; }
.login-welcome p { font-size:13px; color:#666; font-weight:300; }

.login-form { width:100%; max-width:340px; }

.form-group { margin-bottom:18px; }
.form-label { font-size:11px; font-weight:500; color:#888; text-transform:uppercase; letter-spacing:0.8px; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
.form-label .material-symbols-outlined { font-size:15px; color:#555; }
.form-input { width:100%; background:#141414; border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:14px 16px; font-family:inherit; font-size:14px; color:#F5F5F5; transition:all 0.2s; outline:none; }
.form-input::placeholder { color:#444; }
.form-input:focus { border-color:rgba(200,169,110,0.4); box-shadow:0 0 0 3px rgba(200,169,110,0.08); }

.form-password-wrap { position:relative; }
.form-password-wrap .form-input { padding-right:44px; }
.form-eye { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; color:#555; cursor:pointer; display:flex; padding:0; }
.form-eye:hover { color:#C8A96E; }

.form-options { display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; }
.form-remember { display:flex; align-items:center; gap:8px; cursor:pointer; }
.form-remember input { appearance:none; -webkit-appearance:none; width:16px; height:16px; border:1.5px solid rgba(255,255,255,0.12); border-radius:4px; cursor:pointer; position:relative; transition:all 0.15s; background:transparent; }
.form-remember input:checked { background:#C8A96E; border-color:#C8A96E; }
.form-remember input:checked::after { content:''; position:absolute; left:4px; top:1px; width:5px; height:9px; border:solid #111; border-width:0 2px 2px 0; transform:rotate(45deg); }
.form-remember span { font-size:12px; color:#777; }
.form-forgot { font-size:12px; color:#C8A96E; text-decoration:none; font-weight:500; transition:color 0.12s; }
.form-forgot:hover { color:#A68B4B; }

.btn-login { width:100%; background:#C8A96E; color:#111; border:none; padding:14px; border-radius:10px; font-family:inherit; font-size:14px; font-weight:700; cursor:pointer; transition:all 0.15s; display:flex; align-items:center; justify-content:center; gap:8px; letter-spacing:0.3px; }
.btn-login:hover { background:#A68B4B; transform:translateY(-1px); box-shadow:0 4px 16px rgba(200,169,110,0.3); }
.btn-login:active { transform:translateY(0); }
.btn-login .material-symbols-outlined { font-size:18px; }

.login-divider { display:flex; align-items:center; gap:14px; margin:28px 0; width:100%; max-width:340px; }
.login-divider::before, .login-divider::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.06); }
.login-divider span { font-size:10px; color:#444; text-transform:uppercase; letter-spacing:1px; }

.btn-google { width:100%; max-width:340px; background:#1A1A1A; border:1px solid rgba(255,255,255,0.08); padding:12px; border-radius:10px; font-family:inherit; font-size:13px; font-weight:500; color:#B0B0B0; cursor:pointer; transition:all 0.12s; display:flex; align-items:center; justify-content:center; gap:10px; }
.btn-google:hover { background:#222; border-color:rgba(255,255,255,0.12); color:#F5F5F5; }
.btn-google svg { width:18px; height:18px; }

.login-footer { position:absolute; bottom:28px; text-align:center; }
.login-footer p { font-size:10px; color:#333; }
.login-footer a { color:#C8A96E; text-decoration:none; }

/* ── LOADING STATE ── */
.btn-login.loading { pointer-events:none; opacity:0.7; }
.btn-login.loading::after { content:''; width:16px; height:16px; border:2px solid #111; border-top-color:transparent; border-radius:50%; animation:spin 0.6s linear infinite; margin-left:8px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── ERROR ── */
.form-error { background:rgba(192,80,77,0.08); border:1px solid rgba(192,80,77,0.2); border-radius:8px; padding:10px 14px; margin-bottom:18px; display:none; align-items:center; gap:8px; font-size:12px; color:#C0504D; }
.form-error.show { display:flex; }
.form-error .material-symbols-outlined { font-size:16px; flex-shrink:0; }

/* ── RESPONSIVE ── */
@media(max-width:900px) {
  .login-photo { display:none; }
  .login-form-side { width:100%; }
}

@media(max-width:480px) {
  .login-form-side { padding:32px 24px; }
  .login-logo { height:60px; margin-bottom:28px; }
  .login-welcome h1 { font-size:20px; }
  .form-input { padding:12px 14px; font-size:13px; }
  .btn-login { padding:12px; font-size:13px; }
}
</style>
</head>
<body>

<div class="login-page">
  <!-- PHOTO SIDE -->
  <div class="login-photo">
    <img src="/bula/assets/img/login-bg.jpg" alt="">
    <div class="login-photo-overlay"></div>
    <div class="login-photo-badge">
      <div class="login-photo-badge-dot"></div>
      <div class="login-photo-badge-text">Bula Assessoria Pecuaria</div>
    </div>
    <div class="login-photo-content">
      <div class="login-photo-tagline">A <span>maior assessoria</span><br>de leiloes do Brasil.</div>
      <div class="login-photo-sub">Gerencie leiloes, acompanhe resultados e conecte-se com o mercado pecuario em um unico lugar.</div>
    </div>
  </div>

  <!-- FORM SIDE -->
  <div class="login-form-side">
    <img src="/bula/assets/img/logo-bula.png" alt="Bula Assessoria" class="login-logo">

    <div class="login-welcome">
      <h1>Bem-vindo de volta</h1>
      <p>Acesse seu painel de gestao</p>
    </div>

    <div class="form-error" id="form-error">
      <span class="material-symbols-outlined">error</span>
      <span id="error-text">Email ou senha incorretos.</span>
    </div>

    <form class="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label"><span class="material-symbols-outlined">mail</span> Email</label>
        <input class="form-input" type="email" id="login-email" placeholder="seu@email.com" required>
      </div>

      <div class="form-group">
        <label class="form-label"><span class="material-symbols-outlined">lock</span> Senha</label>
        <div class="form-password-wrap">
          <input class="form-input" type="password" id="login-password" placeholder="Digite sua senha" required>
          <button type="button" class="form-eye" onclick="togglePassword()">
            <span class="material-symbols-outlined" id="eye-icon" style="font-size:18px">visibility_off</span>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="form-remember">
          <input type="checkbox" checked>
          <span>Lembrar-me</span>
        </label>
        <a href="#" class="form-forgot">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-login" id="btn-login">
        <span class="material-symbols-outlined">login</span> Entrar
      </button>
    </form>

    <div class="login-divider"><span>ou</span></div>

    <button class="btn-google" onclick="handleGoogle()">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Entrar com Google
    </button>

    <div class="login-footer">
      <p>Bula Assessoria Pecuaria &copy; 2026</p>
    </div>
  </div>
</div>

<script>
function togglePassword() {
  const input = document.getElementById('login-password');
  const icon = document.getElementById('eye-icon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.textContent = 'visibility';
  } else {
    input.type = 'password';
    icon.textContent = 'visibility_off';
  }
}

function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  const error = document.getElementById('form-error');
  error.classList.remove('show');
  btn.classList.add('loading');
  btn.innerHTML = '<span class="material-symbols-outlined">login</span> Entrando...';

  setTimeout(() => {
    // Simulate login - redirect to main system
    window.location.href = "/web-bula/sistema";;
  }, 1500);
}

function handleGoogle() {
  // Placeholder for Google OAuth
  const btn = document.querySelector('.btn-google');
  btn.textContent = 'Conectando...';
  setTimeout(() => {
    window.location.href = "/web-bula/sistema";;
  }, 1500);
}
</script>
</body>
</html>
