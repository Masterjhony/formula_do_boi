<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#D4A85C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-label="Fórmula do Boi">
  <!-- Chifre esquerdo: curva ascendente e externa, ponta sutilmente recolhida -->
  <path d="M 78 80 C 55 60, 38 38, 30 22 C 38 20, 50 28, 60 42 C 70 56, 76 70, 80 78"/>

  <!-- Chifre direito: espelhado -->
  <path d="M 122 80 C 145 60, 162 38, 170 22 C 162 20, 150 28, 140 42 C 130 56, 124 70, 120 78"/>

  <!-- Topo da cabeça conectando os chifres -->
  <path d="M 80 78 Q 100 70, 120 78"/>

  <!-- Laterais da cabeça em forma de trapézio arredondado -->
  <path d="M 80 78 L 78 140 Q 82 158, 100 162 Q 118 158, 122 140 L 120 78"/>

  <!-- Duas narinas centradas no focinho -->
  <circle cx="91" cy="128" r="3" fill="#D4A85C" stroke="none"/>
  <circle cx="109" cy="128" r="3" fill="#D4A85C" stroke="none"/>
</svg>
